server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:18084}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:15434/finance}
spring.datasource.username=${DATABASE_USER:finance}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=false
