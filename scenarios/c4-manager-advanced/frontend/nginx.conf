server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location /api/ { proxy_pass http://backend:18084; proxy_set_header Host $host; }
 location / { try_files $uri $uri/ /index.html; }
}
