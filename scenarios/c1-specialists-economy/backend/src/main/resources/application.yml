spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DATABASE_USER:finance}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
  error:
    include-message: never
