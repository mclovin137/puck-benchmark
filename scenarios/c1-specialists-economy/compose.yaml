services:
  database:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes: [finance-data:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-finance}
      DATABASE_USER: ${POSTGRES_USER:-finance}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env local}
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      database: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [api]
    ports: ["127.0.0.1:5173:5173"]
volumes:
  finance-data:
