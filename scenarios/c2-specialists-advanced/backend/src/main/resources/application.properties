spring.application.name=puck-finance
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/finance}
spring.datasource.username=${DB_USER:finance}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=32KB
app.cors-origin=${CORS_ORIGIN:http://localhost:18202}
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
