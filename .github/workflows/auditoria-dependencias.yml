name: auditoria-dependencias

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: auditoria-dependencias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditoria:
    name: auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Obter OSV-Scanner fixado
        run: python3 benchmark/scripts/install_tools.py
      - name: Auditar manifests e locks
        run: >-
          python3 scripts/ci/dependency-audit.py
          --root .
          --scanner .private/tools/osv-scanner
          --triage experiment/dependency-triage.json
          --report dependency-audit.json
      - name: Publicar relatório sanitizado
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auditoria-dependencias-${{ github.sha }}
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 30
