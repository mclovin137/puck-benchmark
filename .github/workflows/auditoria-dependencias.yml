name: auditoria-dependencias

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: auditoria-dependencias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditoria:
    name: auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter fontes candidatas sem credenciais persistidas
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Obter avaliador e decisões admitidos nos PRs 25, 34 e 38
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 27e5b81f36df545fa6f60f4012d4cfbcf8de6d13
          path: trusted
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Obter OSV-Scanner fixado pelo avaliador confiável
        run: python3 -I trusted/benchmark/scripts/install_tools.py
      - name: Auditar nove fontes com decisões restritas ao snapshot
        run: >-
          python3 -I trusted/scripts/ci/dependency-audit.py
          --root "${{ github.workspace }}/candidate"
          --trusted-root "${{ github.workspace }}/trusted"
          --trusted-sha 27e5b81f36df545fa6f60f4012d4cfbcf8de6d13
          --scanner .private/tools/osv-scanner
          --report "${{ runner.temp }}/dependency-audit.json"
      - name: Publicar relatório sanitizado
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auditoria-dependencias-${{ github.sha }}
          path: ${{ runner.temp }}/dependency-audit.json
          if-no-files-found: error
          retention-days: 30
