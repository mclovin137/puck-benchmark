name: bootstrap-a0

on:
  pull_request:
    branches: [integration/pentest-bootstrap, main]
  push:
    branches: [integration/pentest-bootstrap, main]

permissions:
  contents: read

concurrency:
  group: bootstrap-a0-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verificacoes-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Exigir escopo e imports no head e merge de teste
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/bootstrap.py verify --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Verificar segredos sem rede no scanner
        run: >-
          docker run --rm --network none -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner
      - name: Sintaxe dos arquivos admitidos
        run: |
          python3 - <<'PY'
          import ast, json, pathlib, subprocess
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              p = pathlib.Path(raw.decode())
              if p.suffix == '.py':
                  ast.parse(p.read_text(), filename=str(p))
              elif p.suffix == '.json':
                  json.loads(p.read_text())
          PY
          node --check benchmark/pentest/ui-security.cjs
      - name: Fixtures negativas do bootstrap e A0 existente
        run: |
          python3 -m unittest discover -s benchmark/bootstrap -v
          python3 -m unittest discover -s benchmark/pentest/tests -v
      - name: Resolver lock npm sem scripts nem navegador
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          task_npm_dir="$(mktemp -d)"
          cp benchmark/pentest/package.json benchmark/pentest/package-lock.json "$task_npm_dir/"
          npm --prefix "$task_npm_dir" ci --ignore-scripts --no-audit --no-fund
      - name: Obter scanner oficial fixado
        run: python3 -I benchmark/scripts/install_tools.py
      - name: Auditar npm e pypdf sem exceções
        run: >-
          python3 scripts/ci/bootstrap.py audit
          --scanner "$GITHUB_WORKSPACE/.private/tools/osv-scanner"
          --report "${{ runner.temp }}/bootstrap-dependencies.json"
      - name: Publicar somente metadados de dependências
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bootstrap-dependencies-${{ github.sha }}
          path: ${{ runner.temp }}/bootstrap-dependencies.json
          if-no-files-found: error
          retention-days: 30
  gate-bootstrap-a0:
    if: always()
    needs: [verificacoes-bootstrap]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir preparação concluída
        env:
          RESULTADO: ${{ needs.verificacoes-bootstrap.result }}
        run: test "$RESULTADO" = success
