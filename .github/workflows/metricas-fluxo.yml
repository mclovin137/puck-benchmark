# Métricas de eficiência do fluxo (sem LLM): horas até o merge, commits depois da abertura do PR
# (rodadas de correção), falhas de CI e participação de documentação vs código/teste/config.
# Acompanhamento, não gate. Resultado no resumo do job e em artefato JSON.
name: metricas-fluxo

on:
  schedule:
    - cron: "0 9 * * 1"   # segunda-feira, 06:00 America/Sao_Paulo
  workflow_dispatch:
    inputs:
      dias:
        description: "Janela em dias"
        default: "30"

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Calcular métricas do fluxo
        env:
          GH_TOKEN: ${{ github.token }}
          DIAS: ${{ inputs.dias || '30' }}
        run: python3 scripts/ci/metricas-fluxo.py --repo "$GITHUB_REPOSITORY" --dias "$DIAS" --saida metricas-fluxo.json --resumo "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metricas-fluxo
          path: metricas-fluxo.json
          retention-days: 30
