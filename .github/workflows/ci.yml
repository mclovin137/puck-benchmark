# CI completa: só no PR de virada de versão (dev → main) e em main. PRs para dev usam ci-rapida.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:   # reutilizada pelo cd-production no mesmo SHA

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-review:
    name: code-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exigir contrato e validação de código do projeto
        run: |
          test -s docs/rules.md
          test -s docs/lib.md
          test -s docs/verificacao.md
          test -x scripts/ci/code-review.sh
          scripts/ci/code-review.sh

  security-review:
    name: security-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exigir verificação de segurança específica do projeto
        run: |
          test -x scripts/ci/security-review.sh
          scripts/ci/security-review.sh
      - name: Verificar segredos no histórico
        run: test -s .gitleaks.toml
      - name: Executar Gitleaks no histórico
        run: >-
          docker run --rm
          --network none -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  test-review:
    name: test-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exigir testes do projeto
        run: |
          test -x scripts/ci/test-review.sh
          scripts/ci/test-review.sh

  architecture-review:
    name: architecture-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exigir verificação arquitetural específica da stack
        run: |
          test -x scripts/ci/architecture-review.sh
          scripts/ci/architecture-review.sh

  application-acceptance:
    name: application-${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [C1, C2, C3, C4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build e testes dos componentes completos
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: python3 benchmark/scripts/check_applications.py --scenario "$SCENARIO"
      - name: Instalar dependência do avaliador externo
        run: python3 -m pip install -r benchmark/requirements.txt
      - name: Subir ambiente efêmero e executar o mesmo aceite HTTP
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: python3 benchmark/scripts/run_system_evaluation.py --scenario "$SCENARIO"
      - name: Publicar somente resultados sanitizados
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-${{ matrix.scenario }}
          path: |
            experiment/results/*-acceptance.json
            experiment/results/system-*.json
          if-no-files-found: error

  gate:
    name: gate
    if: ${{ always() }}
    needs: [code-review, security-review, test-review, architecture-review, application-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir todos os checks
        env:
          CODE: ${{ needs.code-review.result }}
          SECURITY: ${{ needs.security-review.result }}
          TEST: ${{ needs.test-review.result }}
          ARCHITECTURE: ${{ needs.architecture-review.result }}
          APPLICATION: ${{ needs.application-acceptance.result }}
        run: |
          printf 'code-review=%s security-review=%s test-review=%s architecture-review=%s\n' "$CODE" "$SECURITY" "$TEST" "$ARCHITECTURE"
          test "$CODE" = success
          test "$SECURITY" = success
          test "$TEST" = success
          test "$ARCHITECTURE" = success
          test "$APPLICATION" = success
