version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: daily
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencias, seguranca]
    groups:
      minor-patch:
        update-types: [minor, patch]
